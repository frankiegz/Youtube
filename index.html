<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Just this video</title>
  <style>
    :root {color-scheme: dark; font-family: system-ui, -apple-system, sans-serif;}
    * { box-sizing: border-box; }
    body { background: #101116; color: #f5f6fa; margin: 0; padding: 24px 16px; }
    main { max-width: 940px; margin: 24px auto 0; }
    h1 { font-size: clamp(1.35rem, 4vw, 2rem); margin: 0 0 8px; }
    p { color: #c2c5d0; line-height: 1.55; }
    .video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; margin-top: 24px; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    #done { margin-top: 32px; padding: 24px; text-align: center; background: #20232c; border-radius: 12px; }
    #done h2 { margin: 0 0 8px; }
    [hidden] { display: none !important; }
    .small { font-size: .9rem; margin-top: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>Just this video.</h1>
    <p>No YouTube home feed, Shorts wall, or endless scrolling.</p>
    <div id="videoContainer" class="video" hidden></div>
    <section id="done" hidden>
      <h2>You're finished.</h2>
      <p>Close this tab and return to Telegram whenever you're ready.</p>
    </section>
    <p id="message" class="small">Loading video player…</p>
  </main>
  <script>
    (function () {
      'use strict';
      const params = new URLSearchParams(window.location.search);
      const id = params.get('v') || '';
      const message = document.getElementById('message');
      const container = document.getElementById('videoContainer');
      const done = document.getElementById('done');

      if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
        message.textContent = 'No valid video link supplied. Open a link sent by your Telegram bot.';
        return;
      }

      const frame = document.createElement('iframe');
      frame.id = 'youtube-player';
      frame.title = 'YouTube video player';
      frame.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id)
        + '?enablejsapi=1&playsinline=1&rel=0&autoplay=0&origin=' + encodeURIComponent(window.location.origin);
      frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      frame.setAttribute('allowfullscreen', '');
      container.appendChild(frame);
      container.hidden = false;
      message.textContent = 'Play this one video, then close the page.';

      // The official YouTube IFrame API lets the page remove the player at the end.
      // YouTube can still show its own ads and some in-player prompts before then.
      window.onYouTubeIframeAPIReady = function () {
        new YT.Player('youtube-player', {
          events: {
            onStateChange: function (event) {
              if (event.data === YT.PlayerState.ENDED) {
                event.target.destroy();
                container.hidden = true;
                done.hidden = false;
                message.textContent = '';
              }
            }
          }
        });
      };

      const script = document.createElement('script');
      script.src = 'https://www.youtube.com/iframe_api';
      script.async = true;
      document.head.appendChild(script);
    }());
  </script>
</body>
</html>
